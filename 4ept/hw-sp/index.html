<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>4EPT Homework SP</title>
  <meta name="description" content="4EPT homework special reading pages.">
  <style>
    :root {
      color-scheme: light;
      --ink: #172132;
      --muted: #637086;
      --line: #d7e0ea;
      --paper: #ffffff;
      --soft: #f2f6fa;
      --navy: #12304f;
      --blue: #2c6fa3;
      --sky: #e9f5ff;
      --road: #485463;
      --accent: #d6a540;
      --shadow: 0 18px 44px rgba(18, 48, 79, .15);
      font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(233, 245, 255, .96), rgba(255, 255, 255, .92) 42%, #f7f9fb),
        radial-gradient(circle at 12% 8%, rgba(214, 165, 64, .18), transparent 280px);
    }

    .page {
      width: min(100%, 430px);
      margin: 0 auto;
      padding: 10px 8px 34px;
    }

    .hero {
      display: grid;
      gap: 14px;
      padding: 14px;
      border: 1px solid rgba(18, 48, 79, .12);
      border-radius: 10px;
      background: rgba(255, 255, 255, .86);
      box-shadow: var(--shadow);
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
      padding: 6px;
      border: 1px solid rgba(18, 48, 79, .12);
      border-radius: 10px;
      background: rgba(255, 255, 255, .72);
      box-shadow: 0 10px 24px rgba(18, 48, 79, .08);
    }

    .player-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      min-height: 48px;
      margin-bottom: 8px;
      padding: 0 16px;
      border: 1px solid rgba(18, 48, 79, .16);
      border-radius: 8px;
      color: #fff;
      background: linear-gradient(135deg, var(--navy), var(--blue));
      box-shadow: 0 10px 24px rgba(18, 48, 79, .14);
      font: inherit;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
    }

    .player-toggle-icon {
      font-size: 20px;
      line-height: 1;
      transition: transform .2s ease;
    }

    .player-toggle[aria-expanded="true"] .player-toggle-icon {
      transform: rotate(180deg);
    }

    .master-player {
      display: grid;
      gap: 12px;
      margin-bottom: 14px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 12px 28px rgba(18, 48, 79, .12);
    }

    .master-player[hidden] {
      display: none;
    }

    .master-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .master-scope {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
    }

    .master-modes {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .master-option {
      min-height: 36px;
      padding: 4px;
      border: 1px solid #c6d8e8;
      border-radius: 7px;
      color: var(--navy);
      background: #fff;
      font: inherit;
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
    }

    .master-option.active {
      color: #fff;
      border-color: var(--blue);
      background: var(--blue);
    }

    .master-now {
      min-height: 58px;
      padding: 10px 12px;
      border-left: 4px solid var(--accent);
      background: var(--soft);
    }

    .master-meta {
      margin: 0 0 4px;
      color: var(--blue);
      font-size: 11px;
      font-weight: 900;
    }

    .master-sentence {
      margin: 0;
      color: var(--ink);
      font-size: 14px;
      font-weight: 800;
      line-height: 1.45;
    }

    .master-transport {
      display: grid;
      grid-template-columns: 40px 1fr 40px;
      gap: 8px;
      align-items: center;
    }

    .master-skip {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border: 1px solid #c6d8e8;
      border-radius: 50%;
      color: var(--navy);
      background: #fff;
      font-size: 16px;
      cursor: pointer;
    }

    .tab-btn {
      min-height: 44px;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--navy);
      background: transparent;
      font: inherit;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
    }

    .tab-btn.active {
      color: #fff;
      border-color: var(--navy);
      background: linear-gradient(135deg, var(--navy), var(--blue));
      box-shadow: 0 8px 18px rgba(18, 48, 79, .18);
    }

    .hero-images {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .hero-images img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid rgba(18, 48, 79, .12);
    }

    .title-block {
      display: grid;
      gap: 7px;
      padding: 4px 2px 2px;
    }

    .eyebrow {
      color: var(--blue);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--navy);
      font-size: clamp(30px, 6vw, 56px);
      line-height: 1;
      letter-spacing: 0;
    }

    .period {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
    }

    .guidance {
      margin: 0;
      color: #334155;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.7;
    }

    .lead {
      margin: 0;
      color: #334155;
      font-size: 15px;
      line-height: 1.75;
    }

    .text-card,
    .practice {
      margin-top: 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--paper);
      box-shadow: 0 12px 30px rgba(18, 48, 79, .08);
    }

    .text-card {
      padding: 18px;
    }

    .text-card p {
      margin: 0;
      color: #1f2937;
      font-size: 16px;
      line-height: 1.85;
    }

    .practice {
      overflow: hidden;
    }

    .section-head {
      padding: 16px 18px;
      color: #fff;
      background: linear-gradient(135deg, var(--navy), var(--road));
    }

    .section-head h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .section-head p {
      margin: 6px 0 0;
      color: rgba(255, 255, 255, .82);
      font-size: 13px;
      line-height: 1.55;
    }

    .sentence-list {
      display: grid;
      gap: 12px;
      padding: 12px;
      background: var(--soft);
    }

    .sentence-card {
      display: grid;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
    }

    .sentence-head {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 10px;
      align-items: start;
    }

    .num {
      display: grid;
      place-items: center;
      min-width: 34px;
      height: 34px;
      padding: 0 8px;
      color: #fff;
      border-radius: 8px;
      background: var(--blue);
      font-size: 13px;
      font-weight: 900;
    }

    .sentence {
      margin: 0;
      color: #111827;
      font-size: 16px;
      font-weight: 800;
      line-height: 1.55;
    }

    .players {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .player {
      display: grid;
      gap: 8px;
      padding: 10px;
      border: 1px solid #dce6ef;
      border-radius: 8px;
      background: #fbfdff;
    }

    .player-title {
      color: var(--navy);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
    }

    audio {
      width: 100%;
    }

    .speed-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .speed-btn {
      min-height: 32px;
      border: 1px solid #c6d8e8;
      border-radius: 8px;
      color: var(--navy);
      background: #fff;
      font: inherit;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .speed-btn.active {
      color: #fff;
      border-color: var(--blue);
      background: var(--blue);
    }

    .top-btn {
      position: fixed;
      right: max(12px, calc((100vw - 430px) / 2 + 12px));
      bottom: 14px;
      z-index: 20;
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border: 1px solid rgba(255, 255, 255, .6);
      border-radius: 50%;
      color: #fff;
      background: linear-gradient(135deg, var(--navy), var(--blue));
      box-shadow: 0 12px 24px rgba(18, 48, 79, .28);
      font-size: 24px;
      font-weight: 900;
      line-height: 1;
      cursor: pointer;
    }

    .top-btn:active {
      transform: translateY(1px);
    }

    @media (min-width: 431px) {
      body {
        background:
          linear-gradient(90deg, #dce8f1 0, #f7f9fb calc(50% - 215px), #f7f9fb calc(50% + 215px), #dce8f1 100%);
      }
    }

    @media (max-width: 680px) {
      .hero {
        padding: 10px;
      }

      .hero-images {
        gap: 5px;
      }

      .text-card {
        padding: 14px;
      }

    }
  </style>
</head>
<body>
  <div class="page">
    <button class="player-toggle" type="button" id="playerToggle" aria-expanded="false" aria-controls="masterPlayer">
      <span>PLAYER</span>
      <span class="player-toggle-icon" aria-hidden="true">⌄</span>
    </button>

    <section class="master-player" id="masterPlayer" aria-label="All audio player" hidden>
      <div>
        <div class="master-label">PLAYLIST</div>
        <div class="master-scope" id="masterScope">
          <button class="master-option active" type="button" data-scope="all">ALL</button>
          <button class="master-option" type="button" data-scope="tag2">HW 2</button>
          <button class="master-option" type="button" data-scope="tag3">HW 3</button>
          <button class="master-option" type="button" data-scope="tag4">HW 4</button>
        </div>
      </div>

      <div>
        <div class="master-label">LOOP MODE</div>
        <div class="master-modes" id="masterModes">
          <button class="master-option active" type="button" data-mode="all">ALL LOOP</button>
          <button class="master-option" type="button" data-mode="single">SINGLE LOOP</button>
        </div>
      </div>

      <div class="master-now" aria-live="polite">
        <p class="master-meta" id="masterMeta"></p>
        <p class="master-sentence" id="masterSentence"></p>
      </div>

      <div class="master-transport">
        <button class="master-skip" type="button" id="masterPrev" aria-label="Previous audio" title="Previous audio">◀</button>
        <audio id="masterAudio" controls preload="metadata"></audio>
        <button class="master-skip" type="button" id="masterNext" aria-label="Next audio" title="Next audio">▶</button>
      </div>

      <div class="speed-row" id="masterSpeed" aria-label="Master player playback speed">
        <button class="speed-btn" type="button" data-rate="0.25">0.25</button>
        <button class="speed-btn" type="button" data-rate="0.5">0.5</button>
        <button class="speed-btn" type="button" data-rate="0.75">0.75</button>
        <button class="speed-btn active" type="button" data-rate="1">1.0</button>
      </div>
    </section>

    <nav class="tabs" aria-label="Homework tags">
      <button class="tab-btn active" type="button" data-tag="tag2">HW 2</button>
      <button class="tab-btn" type="button" data-tag="tag3">HW 3</button>
      <button class="tab-btn" type="button" data-tag="tag4">HW 4</button>
    </nav>

    <header class="hero">
      <div class="hero-images" id="heroImages" aria-label="Homework thumbnails">
        <img src="assets/images/uncle-1.jpeg" alt="">
        <img src="assets/images/uncle-2.jpeg" alt="">
        <img src="assets/images/uncle-3.jpeg" alt="">
      </div>
      <div class="title-block">
        <div class="eyebrow">4EPT Homework SP</div>
        <h1 id="pageTitle">Uncle Robert</h1>
        <p class="period" id="pagePeriod">2026年3月 〜 2026年6月</p>
        <p class="guidance">まずは音声を活用せずに音読に挑戦しましょう。その後音声を確認しギャップを埋めながら練習してください！</p>
      </div>
    </header>

    <section class="text-card" aria-label="Reading passage">
      <p id="passageText"></p>
    </section>

    <section class="practice" aria-label="Sentence audio practice">
      <div class="section-head">
        <h2>Sentence Practice</h2>
        <p>音声を活用し練習しましょう。気になる単語は発音記号を調べてOKです。</p>
      </div>
      <div class="sentence-list" id="sentenceList"></div>
    </section>

    <button class="top-btn" type="button" id="topBtn" aria-label="Back to top">↑</button>
  </div>

  <script>
    const tags = {
      tag1: {
        title: "Car Society",
        period: "2026年3月 〜 2026年6月",
        images: [
          ["assets/images/car-1.jpeg", "Driver holding a steering wheel"],
          ["assets/images/car-2.jpeg", "Car on a road at dusk"],
          ["assets/images/car-3.jpeg", "Busy city traffic in Japan"]
        ],
        audio: { normal: "normal", slow: "slow" },
        sentences: [
          "In Japan, cars are essential for daily life.",
          "Iconic brands like Toyota and Honda, known for their reliable vehicles and advanced technologies such as hybrid engines and automated driving systems, are widely used.",
          "Cities such as Tokyo, Osaka, and Nagoya are bustling hubs where millions drive cars known for their dependability and innovation.",
          "Japan is one of the world's top producers of cars, with over 5 million sold annually.",
          "Alongside cars, the Shinkansen represents advanced transportation.",
          "Drivers follow strict regulations to ensure safety on highways and city streets.",
          "The Toyota Prius, famous for being eco-friendly, remains popular.",
          "Kei cars, small and fuel-efficient, are common on crowded city roads.",
          "Japan's automotive landscape blends tradition with innovation, where cars are not just convenient but also culturally significant."
        ]
      },
      tag2: {
        title: "Uncle Robert",
        period: "2026年3月 〜 2026年6月",
        images: [
          ["assets/images/uncle-1.jpeg", "Hiker standing beside a lake"],
          ["assets/images/uncle-2.jpeg", "Dog and cat in a yard"],
          ["assets/images/uncle-3.jpeg", "Red electric guitar"]
        ],
        audio: { normal: "tag2-normal", slow: "tag2-slow" },
        sentences: [
          "Uncle Robert, who was born in 1965, lived in Riverton, a small town.",
          "His loyal companions included Max, the dog, Whiskers, the cat, and three chirpy birds: Tweety, Polly, and Charlie.",
          "During the summers, he took us on thrilling trips.",
          "We ventured into the waters of Lake Johnson for fishing, enjoyed picnics in Greenfield Park, and hiked the trails of Blue Mountain.",
          "Uncle Robert loved to tell us about his travels to faraway places like Paris, Tokyo, and Rio de Janeiro.",
          "A talented musician, he mastered the guitar, piano, and harmonica.",
          "His fondness for \"Yesterday\" by The Beatles was evident.",
          "Though he passed away last year, his memory resonates within us, cherished and enduring.",
          "His laughter still stays with us, bringing warmth even on the coldest days."
        ]
      },
      tag3: {
        title: "Magic",
        period: "2026年3月 〜 2026年6月",
        images: [
          ["assets/images/magic-1.jpeg", "Playing cards and coins"],
          ["assets/images/magic-2.jpeg", "Magician performing with a wand"],
          ["assets/images/magic-3.jpeg", "Las Vegas at night"]
        ],
        audio: { single: "tag3" },
        sentences: [
          "Magic is an amazing art that fascinates audiences everywhere.",
          "Magicians use wands and say mysterious words to perform incredible tricks.",
          "For example, pulling a rabbit out of a hat always amazes people.",
          "The number three holds special significance in many illusions;",
          "watch closely as the magician makes three colorful scarves disappear and reappear in a puff of smoke.",
          "Famous magicians like David Copper field have dazzled audiences with their extraordinary big tricks,",
          "such as making the Statue of Liberty vanish into thin air.",
          "In Las Vegas, the entertainment capital of the world, magicians perform nightly shows with 52 mind-bending tricks using playing cards and coins.",
          "Over 2,000,000 people watch these shows every year.",
          "So, get ready to be amazed as you witness the magic unfold before your eyes!"
        ]
      },
      tag4: {
        title: "The Johnny Appleseed Festival",
        period: "2026年3月 〜 2026年6月",
        images: [
          ["assets/images/festival-1.jpg", "Dancers performing at the Johnny Appleseed Festival"],
          ["assets/images/festival-2.jpg", "Festival visitors beside a historic tent"],
          ["assets/images/festival-3.jpg", "Apple pancake roll-ups at the festival" ]
        ],
        audio: { single: "tag4" },
        sentences: [
          "The Johnny Appleseed Festival is held every year in Fort Wayne, Indiana, to honor the memory of John Chapman, who is popularly remembered as Johnny Appleseed.",
          "He was born on September 26, 1774, and became widely known for spreading apple seeds throughout the United States.",
          "The event is organized on the third weekend of September, and in 2023, it took place on September 16th and 17th.",
          "More than 300 vendors joined the festival, selling regional foods, handmade crafts, and local products.",
          "Visitors could enjoy folk music, storytelling performances, and apple-inspired activities.",
          "Many families shared fresh apple cider and homemade pies.",
          "Approximately 250,000 people visit the event each year.",
          "It remains a significant celebration of his remarkable influence on American culture."
        ]
      }
    };

    const visibleTagKeys = ["tag2", "tag3", "tag4"];
    let activeTag = "tag2";
    const heroImages = document.getElementById("heroImages");
    const pageTitle = document.getElementById("pageTitle");
    const pagePeriod = document.getElementById("pagePeriod");
    const passageText = document.getElementById("passageText");
    const sentenceList = document.getElementById("sentenceList");
    const playerToggle = document.getElementById("playerToggle");
    const masterPlayer = document.getElementById("masterPlayer");
    const masterAudio = document.getElementById("masterAudio");
    const masterMeta = document.getElementById("masterMeta");
    const masterSentence = document.getElementById("masterSentence");
    let masterScope = "all";
    let masterMode = "all";
    let masterRate = 1;
    let masterIndex = 0;
    let masterPlaylist = [];

    function padNumber(number) {
      return String(number).padStart(2, "0");
    }

    function playerMarkup(folder, label, number) {
      const file = `assets/audio/${folder}/sentence-${padNumber(number)}.mp3`;
      return `
        <div class="player">
          <div class="player-title">${label}</div>
          <audio controls preload="metadata" src="${file}"></audio>
          <div class="speed-row" aria-label="${label} playback speed">
            <button class="speed-btn" type="button" data-rate="0.25">0.25</button>
            <button class="speed-btn" type="button" data-rate="0.5">0.5</button>
            <button class="speed-btn" type="button" data-rate="0.75">0.75</button>
            <button class="speed-btn active" type="button" data-rate="1">1.0</button>
          </div>
        </div>
      `;
    }

    function audioVariants(tag) {
      if (tag.audio.single) {
        return [{ folder: tag.audio.single, label: "Audio" }];
      }
      return [{ folder: tag.audio.normal, label: "Normal" }];
    }

    function buildMasterPlaylist(scope) {
      const tagKeys = scope === "all" ? visibleTagKeys : [scope];
      return tagKeys.flatMap((tagKey) => {
        const tag = tags[tagKey];
        const variants = audioVariants(tag);
        return tag.sentences.flatMap((sentence, sentenceIndex) => (
          variants.map((variant) => ({
            src: `assets/audio/${variant.folder}/sentence-${padNumber(sentenceIndex + 1)}.mp3`,
            sentence,
            label: variant.label,
            homework: `HW ${tagKey.replace("tag", "")}`,
            sentenceNumber: sentenceIndex + 1
          }))
        ));
      });
    }

    function loadMasterTrack(index, autoplay = false) {
      if (!masterPlaylist.length) return;
      masterIndex = (index + masterPlaylist.length) % masterPlaylist.length;
      const track = masterPlaylist[masterIndex];
      masterAudio.src = track.src;
      masterAudio.loop = masterMode === "single";
      masterAudio.playbackRate = masterRate;
      masterMeta.textContent = `${track.homework} · ${track.sentenceNumber} · ${track.label} · ${masterIndex + 1}/${masterPlaylist.length}`;
      masterSentence.textContent = track.sentence;
      if (autoplay) {
        masterAudio.play().catch(() => {});
      }
    }

    function resetMasterPlaylist(autoplay = false) {
      masterPlaylist = buildMasterPlaylist(masterScope);
      loadMasterTrack(0, autoplay);
    }

    function render() {
      const tag = tags[activeTag];
      pageTitle.textContent = tag.title;
      pagePeriod.textContent = tag.period;
      passageText.textContent = tag.sentences.join(" ");
      heroImages.innerHTML = tag.images.map(([src, alt]) => (
        `<img src="${src}" alt="${alt}">`
      )).join("");

      sentenceList.innerHTML = tag.sentences.map((sentence, index) => {
        const number = index + 1;
        const players = tag.audio.single
          ? playerMarkup(tag.audio.single, "Audio", number)
          : `
              ${playerMarkup(tag.audio.normal, "Speaker 1", number)}
              ${playerMarkup(tag.audio.slow, "Speaker 2", number)}
            `;
        return `
          <article class="sentence-card">
            <div class="sentence-head">
              <span class="num">${number}</span>
              <p class="sentence">${sentence}</p>
            </div>
            <div class="players">
              ${players}
            </div>
          </article>
        `;
      }).join("");
    }

    document.querySelectorAll(".tab-btn").forEach((button) => {
      button.addEventListener("click", () => {
        activeTag = button.dataset.tag;
        document.querySelectorAll(".tab-btn").forEach((item) => {
          item.classList.toggle("active", item === button);
        });
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });

    playerToggle.addEventListener("click", () => {
      const isOpen = playerToggle.getAttribute("aria-expanded") === "true";
      playerToggle.setAttribute("aria-expanded", String(!isOpen));
      masterPlayer.hidden = isOpen;
    });

    document.getElementById("masterScope").addEventListener("click", (event) => {
      const button = event.target.closest("[data-scope]");
      if (!button) return;
      const wasPlaying = !masterAudio.paused;
      masterScope = button.dataset.scope;
      document.querySelectorAll("[data-scope]").forEach((item) => {
        item.classList.toggle("active", item === button);
      });
      resetMasterPlaylist(wasPlaying);
    });

    document.getElementById("masterModes").addEventListener("click", (event) => {
      const button = event.target.closest("[data-mode]");
      if (!button) return;
      masterMode = button.dataset.mode;
      masterAudio.loop = masterMode === "single";
      document.querySelectorAll("[data-mode]").forEach((item) => {
        item.classList.toggle("active", item === button);
      });
    });

    document.getElementById("masterPrev").addEventListener("click", () => {
      loadMasterTrack(masterIndex - 1, true);
    });

    document.getElementById("masterNext").addEventListener("click", () => {
      loadMasterTrack(masterIndex + 1, true);
    });

    document.getElementById("masterSpeed").addEventListener("click", (event) => {
      const button = event.target.closest(".speed-btn");
      if (!button) return;
      masterRate = Number(button.dataset.rate);
      masterAudio.playbackRate = masterRate;
      document.querySelectorAll("#masterSpeed .speed-btn").forEach((item) => {
        item.classList.toggle("active", item === button);
      });
    });

    masterAudio.addEventListener("ended", () => {
      if (masterMode === "all") {
        loadMasterTrack(masterIndex + 1, true);
      }
    });

    document.addEventListener("play", (event) => {
      if (!(event.target instanceof HTMLAudioElement)) return;
      document.querySelectorAll("audio").forEach((audio) => {
        if (audio !== event.target) audio.pause();
      });
    }, true);

    sentenceList.addEventListener("click", (event) => {
      const button = event.target.closest(".speed-btn");
      if (!button) return;
      const player = button.closest(".player");
      const audio = player.querySelector("audio");
      audio.playbackRate = Number(button.dataset.rate);
      player.querySelectorAll(".speed-btn").forEach((item) => {
        item.classList.toggle("active", item === button);
      });
    });

    document.getElementById("topBtn").addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    render();
    resetMasterPlaylist();
  </script>
</body>
</html>
