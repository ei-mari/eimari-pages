      function audioBox(src) {
        if (!src) return "";
        return `
          <div class="audio-box">
            <audio controls preload="metadata" src="${src}"></audio>
            <div class="speed-row" aria-label="再生速度">
              <button type="button" data-speed="0.25">0.25</button>
              <button type="button" data-speed="0.5">0.5</button>
              <button type="button" data-speed="0.75">0.75</button>
              <button type="button" class="is-active" data-speed="1">1.0</button>
            </div>
          </div>
        `;
      }

      function card(item, index, options = {}) {
        const [text, ipa, japanese, src, group] = item;
        const no = String(index + 1).padStart(2, "0");
        const showJapanese = Boolean(japanese);
        return `
          <article class="card">
            <div class="card-head">
              <span class="num">${no}</span>
              <div>
                <p class="text">${text}</p>
                ${group ? `<span class="category-chip">${group}</span>` : ""}
              </div>
            </div>
            <div class="body">
              ${audioBox(src)}
              <details>
                <summary>発音記号を確認する</summary>
                <div class="detail-body">${ipa || "発音記号は後ほど追加します。"}</div>
              </details>
              ${showJapanese ? `
                <details>
                  <summary>日本語を確認する</summary>
                  <div class="detail-body">${japanese}</div>
                </details>
              ` : ""}
            </div>
          </article>
        `;
      }

      document.getElementById("wordsList").innerHTML = words.map((item, index) => card(item, index)).join("");
      document.getElementById("phrasesList").innerHTML = phrases.map((item, index) => card(item, index)).join("");
      document.getElementById("sentencesList").innerHTML = sentences.map((item, index) => card(item, index)).join("");

      document.addEventListener("click", (event) => {
        const tab = event.target.closest("[data-tab]");
        if (tab) {
          document.querySelectorAll("[data-tab]").forEach((item) => item.classList.toggle("is-active", item === tab));
          document.querySelectorAll("[data-panel]").forEach((panel) => {
            panel.classList.toggle("hidden", panel.dataset.panel !== tab.dataset.tab);
          });
          window.scrollTo({ top: 0, behavior: "smooth" });
          return;
        }

        const button = event.target.closest("[data-speed]");
        if (!button) return;
        const box = button.closest(".audio-box");
        const audio = box.querySelector("audio");
        audio.playbackRate = Number(button.dataset.speed);
        box.querySelectorAll("[data-speed]").forEach((item) => {
          item.classList.toggle("is-active", item === button);
        });
      });
    </script>
  </body>
